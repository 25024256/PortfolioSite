<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Contact Page</title>
    <link rel="stylesheet" href="../CSS/main.css">
    <link rel="stylesheet" href="../CSS/index.css">
    <link rel="stylesheet" href="../CSS/contact.css">
    <link rel="stylesheet" href="../CSS/projects.css">
    <link rel="stylesheet" href="../CSS/blog.css">
    <link rel="stylesheet" href="../CSS/about.css">
</head>
<body>
    <header class="header">
    <div class="container header-inner">
        <h1>Emma van Iterson</h1>
        <nav aria-label="Main Navigation">
            <ul class="nav-list">
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="projects.html">My Projects</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a aria-current="page" href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </div>     
    </header>

    <main class="container">
    <section>
        <h2>Contact</h2>
        <p>If you would like to get in touch with me, please fill out the contact form. I look forward to hearing from you!</p>
        
        <form id="contact-form" novalidate>
            <div class="form-group">
                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" aria-describedby="name-error">
                <br><span id="name-error" class="error-message" aria-live="polite" style="color: red;"></span>
            </div>
            <br>
            <div class="form-group">
                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" aria-describedby="email-error">
                <br><span id="email-error" class="error-message" aria-live="polite" style="color: red;"></span>
            </div>
            <br>
            <div class="form-group">
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" aria-describedby="message-error"></textarea>
                <br><span id="message-error" class="error-message" aria-live="polite" style="color: red;"></span>
            </div>
            <br>
            <button type="submit" class="nav-buttons">Send Message</button>
            
            <p id="success-message" aria-live="polite" style="color: green; font-weight: bold;"></p>
        </form>
    </section>
</main>

    <footer>
        <p>&copy; 2026 Emma van Iterson</p>
    </footer>
    <script src="../JS/contact.js"></script>
</body>
</html>
